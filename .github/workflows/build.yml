name: Build My Plan APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Android build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Create local build configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "supabase.url=${SUPABASE_URL:-}"
            echo "supabase.anonKey=${SUPABASE_ANON_KEY:-}"
          } > local.properties

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -e

          mkdir -p keystore

          keytool -genkeypair \
            -v \
            -keystore keystore/myplan-ci-release.jks \
            -storepass changeit \
            -keypass changeit \
            -alias myplan-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=My Plan CI, OU=Build, O=My Plan, L=Minya, ST=Minya, C=EG"

          cat > keystore/keystore.properties <<'EOF'
          storeFile=keystore/myplan-ci-release.jks
          storePassword=changeit
          keyAlias=myplan-ci
          keyPassword=changeit
          EOF

      - name: Make Gradle executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              artifacts/MyPlan-debug.apk
          else
            cp app/build/outputs/apk/release/app-release.apk \
              artifacts/MyPlan-release.apk

            if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
              cp app/build/outputs/mapping/release/mapping.txt \
                artifacts/mapping.txt
            fi
          fi

          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPlan-${{ inputs.build_type }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
